spring:
  cache:
    type: none

  data:
    redis:
      enabled: false
  security:
    filter:
      order: 999999
    user:
      name: testuser
      password: testpass

    # Wyłącz wszystkie security endpointy
    management:
      endpoints:
        web:
          exposure:
  kafka:
    bootstrap-servers: localhost:9092  # nadpisywane przez @ServiceConnection
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
resilience4j:
  circuitbreaker:
    instances:
      device-registry:
        failure-rate-threshold: 50
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        record-exceptions:
          - java.lang.Exception
  timelimiter:
    instances:
      device-registry:
        timeout-duration: 1s

gridflow:
  services:
    device-registry:
      url: http://localhost:1010
server:
  port: 0  # random port
  ssl:
    key-store: classpath:certs/gateway-keystore.p12
    key-store-password: gridflow-secret
    key-store-type: PKCS12
    trust-store: classpath:certs/ca-truststore.p12
    trust-store-password: gridflow-secret
    client-auth: want  # ← wymaga certyfikatu od klienta
